<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Wintertrip Bratislava & Wien</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: eine Spalte wie ein Reiseprogramm. Pro Stadt ein Abschnitt, pro Tag ein Block:
   ein dunkler Fixpunkt, darunter helle Auswahlkarten mit Abstimmung. Bratislava blau (Blaue Kirche), Wien rot (rot-weiß-rot). */
:root{
  --bg:#ECEFF3; --card:#FFFFFF; --soft:#F4F6F9; --ink:#14202B; --muted:#586574; --line:#D3DAE2;
  --sk:#2A5CA8; --sk-tint:#DCE7F6; --at:#B01E38; --at-tint:#F6DDE2;
  --fix-bg:#14202B; --fix-fg:#F2F5F8; --fix-muted:#AEBBC9; --fix-line:#4A5A6B;
  --must-bg:#1E7B57; --must-fg:#FFFFFF; --like-bg:#D8EEE3; --like-fg:#15523B;
  --meh-bg:#E2E7EC; --meh-fg:#46525F; --no-bg:#4B5766; --no-fg:#FFFFFF;
  --warn-bg:#FBEFD5; --warn-fg:#6B4A00;
  --f-display:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D141B; --card:#141E28; --soft:#101922; --ink:#E8EDF2; --muted:#94A2B1; --line:#263443;
    --sk:#7EA8E8; --sk-tint:#1A2B44; --at:#F1869A; --at-tint:#3A1A23;
    --fix-bg:#1D2B3A; --fix-fg:#F2F5F8; --fix-muted:#A3B3C4; --fix-line:#4A5C6F;
    --must-bg:#2FA372; --must-fg:#04140D; --like-bg:#17372B; --like-fg:#9DDCC0;
    --meh-bg:#223140; --meh-fg:#A7B4C2; --no-bg:#5C6B7C; --no-fg:#FFFFFF;
    --warn-bg:#3A2D0E; --warn-fg:#F2D48A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D141B; --card:#141E28; --soft:#101922; --ink:#E8EDF2; --muted:#94A2B1; --line:#263443;
  --sk:#7EA8E8; --sk-tint:#1A2B44; --at:#F1869A; --at-tint:#3A1A23;
  --fix-bg:#1D2B3A; --fix-fg:#F2F5F8; --fix-muted:#A3B3C4; --fix-line:#4A5C6F;
  --must-bg:#2FA372; --must-fg:#04140D; --like-bg:#17372B; --like-fg:#9DDCC0;
  --meh-bg:#223140; --meh-fg:#A7B4C2; --no-bg:#5C6B7C; --no-fg:#FFFFFF;
  --warn-bg:#3A2D0E; --warn-fg:#F2D48A;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto;padding-block:22px 90px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.1}
p{margin:0}
:focus-visible{outline:3px solid var(--sk);outline-offset:2px}

/* Kopf */
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hero h1{font-size:clamp(40px,11vw,60px);font-weight:800;letter-spacing:-.02em;margin-top:6px}
.hero .route-line{font-family:var(--f-display);font-weight:700;font-size:clamp(20px,5.5vw,26px);margin-top:6px}
.sk-t{color:var(--sk)} .at-t{color:var(--at)}
.who{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-top:18px;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:10px}
.who label{font-weight:600}
.who input{flex:1 1 150px;min-width:0;min-height:40px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--soft)}
.who small{flex-basis:100%;color:var(--muted)}
.banner{margin-top:12px;padding:12px 14px;border-radius:10px;background:var(--warn-bg);color:var(--warn-fg);font-weight:500}

/* Navigation */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-top:14px;margin-top:6px;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;min-height:44px;padding:0 14px;background:none;border:0;border-bottom:3px solid transparent;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-family:var(--f-mono);font-size:12.5px;cursor:pointer}
.chip.sk{border-color:var(--sk);color:var(--sk)} .chip.at{border-color:var(--at);color:var(--at)}

/* Regeln und Legende */
.rules{margin-top:20px;padding:16px;background:var(--card);border:1px solid var(--line);border-radius:10px}
.rules h2{font-size:20px}
.rules ul{margin:10px 0 0;padding-left:18px;display:grid;gap:5px}
.legend{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-size:13px}
.legend b{color:var(--ink);font-weight:600}

/* Städte und Tage */
.city{margin-top:36px}
.cityhead{padding-bottom:10px;border-bottom:2px solid currentColor}
.city.sk .cityhead{color:var(--sk)} .city.at .cityhead{color:var(--at)}
.cityhead h2{font-size:clamp(34px,9vw,46px);font-weight:800;letter-spacing:-.02em}
.cityhead p{color:var(--muted);font-size:13.5px;margin-top:4px}
.day{margin-top:28px;display:grid;gap:10px;scroll-margin-top:120px}
.dayhead{display:flex;align-items:baseline;flex-wrap:wrap;gap:2px 10px}
.dow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);min-width:22px}
.dt{font-family:var(--f-display);font-weight:800;font-size:30px;letter-spacing:-.01em}
.city.sk .dt{color:var(--sk)} .city.at .dt{color:var(--at)}
.dayhead h3{font-size:19px;font-weight:700}
.daynote{color:var(--muted);font-size:14px}
.lbl{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.stack{display:grid;gap:10px}
.dinner{padding:11px 14px;border-radius:10px;background:var(--soft);border:1px solid var(--line);font-size:14px}
.city.sk .dinner b{color:var(--sk)} .city.at .dinner b{color:var(--at)}
.foodbox{border:1px solid var(--line);border-radius:10px;background:var(--soft);padding:0}
.foodbox summary{min-height:48px;display:flex;align-items:center;gap:10px;padding:0 14px;font-family:var(--f-display);font-weight:700;font-size:16px;cursor:pointer}
.foodbox summary .cnt{font-family:var(--f-body);font-weight:500;font-size:13px;color:var(--muted)}
.foodbox .stack{padding:0 10px 10px}
.tg{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase}
.votes.two{grid-template-columns:1fr 1fr}
.vb[aria-pressed="true"].v-yes{background:var(--must-bg);color:var(--must-fg);border-color:var(--must-bg)}
.vb.opt[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.optgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px}
.tk{font-size:13.5px;font-weight:500}
.fixcard .tk{color:var(--fix-muted)}
.chk{display:flex;align-items:center;gap:10px;min-height:44px;font-weight:500;cursor:pointer}
.chk input{width:20px;height:20px}
.sub{margin-top:26px;font-size:20px}
.subnote{color:var(--muted);font-size:13.5px;margin-top:4px}

/* Karten */
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:10px;min-width:0}
.card.fixcard{background:var(--fix-bg);color:var(--fix-fg);border-color:transparent}
.card h4{font-family:var(--f-display);font-size:18px;font-weight:700;margin:0;line-height:1.2;overflow-wrap:anywhere}
.by{font-size:12.5px;color:var(--muted);font-weight:500}
.fixcard .by,.fixcard .meta,.fixcard .sum,.fixcard .cnote{color:var(--fix-muted)}
.cnote{color:var(--muted);font-size:14px}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted);align-items:center}
.lv{display:inline-flex;align-items:center;gap:3px}
.lv i{width:9px;height:9px;border-radius:50%;border:1.5px solid currentColor;display:inline-block;opacity:.6}
.lv i.on{background:currentColor;opacity:1}
.lv span{margin-left:5px}
.route{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:4px 0;font-size:13.5px}
.route li{display:inline}
.route li:not(:last-child)::after{content:"→";margin:0 7px;opacity:.55}
.votes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.vb{min-height:42px;padding:3px 4px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:12.5px;font-weight:600;line-height:1.1;cursor:pointer;text-wrap:balance}
.fixcard .vb{border-color:var(--fix-line);color:var(--fix-fg)}
.vb:disabled{cursor:not-allowed;opacity:.55}
.vb[aria-pressed="true"].v-must{background:var(--must-bg);color:var(--must-fg);border-color:var(--must-bg)}
.vb[aria-pressed="true"].v-like{background:var(--like-bg);color:var(--like-fg);border-color:var(--like-bg)}
.vb[aria-pressed="true"].v-meh{background:var(--meh-bg);color:var(--meh-fg);border-color:var(--meh-bg)}
.vb.v-rest{grid-column:1/-1}
.vb[aria-pressed="true"].v-rest{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.vb[aria-pressed="true"].v-no{background:var(--no-bg);color:var(--no-fg);border-color:var(--no-bg)}
.sum{display:flex;flex-wrap:wrap;gap:2px 14px;font-size:13px;color:var(--muted)}
.sum b{font-weight:600;color:var(--ink)}
.fixcard .sum b{color:var(--fix-fg)}
.sum.none{font-style:italic}
.linkbtn{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:13px;justify-self:start}
.add{min-height:44px;border:1.5px dashed var(--muted);border-radius:10px;background:transparent;color:var(--ink);font-weight:600;cursor:pointer;padding:0 14px}
.add:hover{background:var(--soft)}
.btn{min-height:44px;padding:0 18px;border-radius:10px;border:0;background:var(--ink);color:var(--bg);font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.empty{padding:18px;border:1px dashed var(--line);border-radius:10px;color:var(--muted);display:grid;gap:10px;justify-items:start}

/* Mein Plan */
.planitem{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:10px}
.planitem.fixed{background:var(--fix-bg);color:var(--fix-fg);border-color:transparent}
.planitem .txt{min-width:0;display:grid;gap:3px}
.planitem strong{font-family:var(--f-display);font-size:16.5px;font-weight:700;overflow-wrap:anywhere}
.planitem .with{font-size:13px;color:var(--muted)}
.planitem.fixed .with,.planitem.fixed .meta{color:var(--fix-muted)}
.tag{flex:0 0 auto;font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:999px;font-family:var(--f-mono);letter-spacing:.03em}
.tag.must{background:var(--must-bg);color:var(--must-fg)}
.tag.like{background:var(--like-bg);color:var(--like-fg)}
.tag.fix{background:var(--fix-fg);color:var(--fix-bg)}
.load{font-size:13px;color:var(--muted)}
.load b{color:var(--ink)}

/* Gruppe und Aufgaben */
.rowcard{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.rowcard .l{min-width:0;display:grid;gap:2px}
.rowcard strong{font-weight:600;overflow-wrap:anywhere}
.rowcard small{color:var(--muted);font-size:13px}
.num{font-family:var(--f-mono);font-size:13px;white-space:nowrap}
.task{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:8px}
.task h4{font-family:var(--f-display);font-size:17px;margin:0}
.people{display:flex;flex-wrap:wrap;gap:6px}
.pp{padding:3px 10px;border-radius:999px;background:var(--like-bg);color:var(--like-fg);font-size:13px;font-weight:600}
.pp.open{background:var(--meh-bg);color:var(--meh-fg);font-weight:500}
.taskbtn{min-height:44px;border-radius:8px;border:1px solid var(--line);background:transparent;font-weight:600;cursor:pointer}
.taskbtn[aria-pressed="true"]{background:var(--must-bg);color:var(--must-fg);border-color:var(--must-bg)}
.taskbtn:disabled{opacity:.55;cursor:not-allowed}

#sheet{position:fixed;inset:0;z-index:20;background:rgba(8,14,20,.55);display:flex;align-items:flex-end;justify-content:center}
#sheet[hidden]{display:none}
.panel{width:100%;max-width:560px;max-height:92%;overflow:auto;background:var(--card);color:var(--ink);border-radius:16px 16px 0 0;padding:18px max(16px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:12px}

.field{display:grid;gap:4px}
.field label,.field legend{font-weight:600;font-size:14px;padding:0}
.field input[type=text],.field select,.field textarea{min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--soft);width:100%}
.field textarea{min-height:70px;resize:vertical}
fieldset.field{border:0;margin:0;padding:0}
.radios{display:flex;flex-wrap:wrap;gap:6px}

.radios input:checked + span{font-weight:700}
.radios label:has(input:checked){background:var(--ink);color:var(--bg);border-color:var(--ink)}
.actions{display:flex;gap:8px;justify-content:flex-end}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:30;max-width:min(92vw,460px);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:10px;font-weight:500;font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.25)}

@media (prefers-reduced-motion:no-preference){.vb,.add,.tab{transition:background .15s,color .15s}}
</style>

<div class="wrap">

<div id="sheet" hidden>

</div>

  +'<li>Alles andere ist Auswahl. Tippe bei jeder Karte, wie viel Lust du hast. „Nichts machen, Pause“ ist auch eine Antwort.</li>'
  +'<li>Eigene Ideen zählen genauso. Trag sie unter dem Tag ein.</li>'
  +'<li>Jeden Abend essen wir fix zusammen, von Fr 01.01. bis Di 05.01. Welches Restaurant, entscheidet ihr per Abstimmung.</li>'
  +'<li>Das Ballett Schwanensee am 05.01. (25 € p. P.) ist freiwillig.</li>'
  +'<li>Wo Tickets vorab gebucht werden müssen (Schönbrunn-Führung, Ballett, Hofreitschule), antwortest du verbindlich mit Ja oder Nein. Pro Sehenswürdigkeit bucht eine feste Person, siehe Aufgaben.</li>'
  +'</ul></section>'
  +'<p class="legend"><span><b>Anstrengung:</b> '+levelHTML(1)+'</span><span>'+levelHTML(2)+'</span><span>'+levelHTML(3)+'</span><span>(Einschätzung, sag Bescheid, wenn sie nicht passt)</span></p>';
 CITIES.forEach(function(c){
  h+='<section class="city '+c.id+'" id="city-'+c.id+'"><div class="cityhead"><h2>'+c.name+'</h2><p>'+esc(c.sub)+'</p></div>';
  c.days.forEach(function(d){h+=dayHTML(d);});
  c.extras.forEach(function(x){
   h+='<h3 class="sub">'+esc(x.title)+'</h3><p class="subnote">'+esc(x.note)+'</p><div class="stack" style="margin-top:10px">'+x.cards.map(function(k){return cardHTML(k);}).join("")+'</div>';
  });
  h+='</section>';
 });
 h+='<section class="city" id="city-free"><div class="cityhead" style="color:var(--ink)"><h2>Freie Ideen</h2><p>Für alles, was zu keinem Tag passt.</p></div>'
  +'<div class="stack" style="margin-top:12px">'+ideasFor("free").map(function(c){return cardHTML(c);}).join("")+'</div>'
  +'<button type="button" class="add" style="margin-top:10px;width:100%" data-act="addidea" data-day="free">+ Eigene Idee eintragen</button></section>';
 return h;
}

function mineHTML(){
 var h='<p class="subnote" style="margin-top:20px">Das ist dein persönlicher Plan aus allem, was du mit „Unbedingt“ oder „Gerne“ markiert hast.</p>';
 var any=false;
 function item(c,fixed){
  var v=me.votes[c.id];
  var st=statsFor(c.id);
  var others=st.must.concat(st.like,st.yes).filter(function(p){return p!==uid;}).map(nameOf);
  var tag;
  if(c.ticket&&v==="yes")tag='<span class="tag must">Ticket: ja</span>';
  else if(c.ticket)tag='<span class="tag fix">Fix · Ticket offen</span>';
  else if(fixed)tag='<span class="tag fix">Fix</span>';
  else tag='<span class="tag '+(v==="must"?"must":"like")+'">'+(v==="must"?"Unbedingt":"Gerne")+'</span>';
  return '<div class="planitem'+(fixed?" fixed":"")+'">'+tag+'<div class="txt"><strong>'+esc(c.title)+'</strong><div class="meta">'+(c.kind==="food"?'<span class="tg">'+esc(c.tag||"Essen")+'</span>':levelHTML(c.level))+'</div>'
   +(others.length?'<span class="with">Auch dabei: '+esc(others.join(", "))+'</span>':'')+'</div></div>';
 }
 DAY_ORDER.forEach(function(id){
  var d=DAYS[id],list=[],load=0;
  var noFix=false;
  d.fixes.forEach(function(f){if(me.votes[f.id]==="no"){noFix=true;}else{list.push(item(f,true));load+=f.level;}});
  var cards=d.cards.concat(d.food).map(function(c){return Object.assign({},c);}).concat(ideasFor(id));
  cards.forEach(function(c){var v=me.votes[c.id];if(v==="must"||v==="like"||v==="yes"){list.push(item(c,false));load+=(c.kind==="food"?0:(c.level||1));any=true;}});
  var note="";
  if(noFix)note='<p class="daynote">Du hast beim Fixpunkt „Lieber nicht“ gewählt. Sprich kurz mit den anderen.</p>';
  var lab=load<=3?"entspannter Tag":(load<=6?"ausgewogener Tag":"ganz schön viel");
  h+='<section class="day c-'+d.city+'"><header class="dayhead"><span class="dow">'+d.dow+'</span><span class="dt" style="color:var(--'+d.city+')">'+d.date+'</span><h3>'+esc(d.title)+'</h3></header>'
   +note+'<div class="stack">'+(list.length?list.join(""):'<p class="daynote">Noch nichts gewählt.</p>')+'</div>'
   +(list.length?'<p class="load">Anstrengung des Tages: <b>'+lab+'</b></p>':'')+'</section>';
 });
 var rest=[];
 staticCards().filter(function(c){return c.dayId==="free";}).concat(ideasFor("free")).forEach(function(c){var v=me.votes[c.id];if(v==="must"||v==="like"||v==="yes"){rest.push(item(c,false));any=true;}});
 if(rest.length)h+='<section class="day"><header class="dayhead"><h3>Ohne festen Tag</h3></header><div class="stack">'+rest.join("")+'</div></section>';
 if(!any)h='<div class="empty" style="margin-top:20px"><p>Du hast noch nichts gewählt. Im Programm findest du alle Vorschläge.</p><button class="btn" data-act="goto" data-tab="plan">Zum Programm</button></div>'+h;
 return h;
}

function groupHTML(){
 var ap=allPeople(),ids=Object.keys(ap).filter(function(p){return Object.keys(ap[p].votes||{}).length||ap[p].nick;});
 var cards=allCards(),total=cards.length;
 var h='<h3 class="sub">Wer hat schon abgestimmt</h3><div class="stack" style="margin-top:10px">';
 if(!ids.length)h+='<div class="empty"><p>Noch niemand. Mach den Anfang im Programm.</p></div>';
 ids.sort(function(a,b){return Object.keys(ap[b].votes||{}).length-Object.keys(ap[a].votes||{}).length;}).forEach(function(p){
  h+='<div class="rowcard"><div class="l"><strong>'+esc(nameOf(p))+(p===uid?" (du)":"")+'</strong></div><span class="num">'+Object.keys(ap[p].votes||{}).length+' von '+total+'</span></div>';
 });
 h+='</div><h3 class="sub">Fixpunkte-Check</h3><p class="subnote">Hier sollten möglichst alle mitkönnen.</p><div class="stack" style="margin-top:10px">';
 DAY_ORDER.forEach(function(id){
  DAYS[id].fixes.forEach(function(f){
   var st=statsFor(f.id),n=st.must.length+st.like.length+st.meh.length+st.no.length+st.rest.length+st.yes.length;
   var s=!n?"Noch keine Stimmen":(st.no.length?st.no.length+"× "+(f.ticket?"Nein":"„Lieber nicht“")+". Kurz besprechen?":"Passt bisher für alle");
   h+='<div class="rowcard"><div class="l"><strong>'+esc(f.title)+'</strong><small>'+dayLabel(id)+' · '+s+'</small></div><span class="num">'+(st.must.length+st.like.length+st.yes.length)+' dafür</span></div>';
  });
 });
 h+='</div><h3 class="sub">Beliebteste Ideen</h3><div class="stack" style="margin-top:10px">';
 var ranked=cards.map(function(c){var st=statsFor(c.id);return {c:c,st:st,score:(st.must.length+st.yes.length)*2+st.like.length};}).filter(function(x){return x.st.must.length+x.st.like.length+x.st.yes.length>0;}).sort(function(a,b){return b.score-a.score;}).slice(0,10);
 if(!ranked.length)h+='<div class="empty"><p>Sobald Stimmen da sind, steht hier, worauf ihr am meisten Lust habt.</p></div>';
 ranked.forEach(function(x){
  h+='<div class="rowcard"><div class="l"><strong>'+esc(x.c.title)+'</strong><small>'+dayLabel(x.c.dayId)+' · '+esc(x.st.must.concat(x.st.yes,x.st.like).map(nameOf).join(", "))+'</small></div><span class="num">'+(x.st.must.length+x.st.yes.length)+' ★ · '+x.st.like.length+' ♥</span></div>';
 });
 return h+'</div>';
}

function dynTasks(){
 var out=[];
 allCards().forEach(function(c){if(c.by&&c.ticket)out.push({id:"tk-"+c.id,single:true,title:"Tickets buchen: "+c.title,note:"Gebucht wird für alle, die bei der Karte Ja gewählt haben."});});
 return out;
}
function ticketCardForTask(id){
 var all=allCards();
 for(var i=0;i<all.length;i++){if(all[i].ticket&&ticketTask(all[i])===id)return all[i];}
 return null;
}
function tasksHTML(){
 var ap=allPeople();
 var h='<p class="subnote" style="margin-top:20px">Wer übernimmt was? Bei den Ticket-Buchungen bucht pro Sehenswürdigkeit genau eine Person. Alles andere können sich mehrere teilen.</p><div class="stack" style="margin-top:12px">';
 TASKS.concat(dynTasks()).forEach(function(t){
  var who=Object.keys(ap).filter(function(p){return (ap[p].tasks||[]).indexOf(t.id)>=0;});
  var mineT=me.tasks.indexOf(t.id)>=0;
  var single=!!t.single;
  var taken=single&&who.length>0&&!mineT;
  var dis=(!ready||!canWrite||!uid||taken)?" disabled":"";
  var tc=single?ticketCardForTask(t.id):null,extra="";
  if(tc){var st=statsFor(tc.id);extra='<p class="cnote">Zusagen bisher: <b>'+st.yes.length+'</b>'+(st.yes.length?' ('+esc(namesOf(st.yes))+')':'')+'. Nein: '+st.no.length+'.</p>';}
  var label=single?(mineT?"Ich buche ✓ (tippen zum Abgeben)":(taken?"Schon vergeben":"Ich buche")):(mineT?"Ich mache das ✓":"Ich übernehme das");
  h+='<div class="task"><h4>'+esc(t.title)+'</h4><p class="cnote">'+esc(t.note)+'</p>'+extra+'<div class="people">'
   +(who.length?who.map(function(p){return '<span class="pp">'+esc(nameOf(p))+'</span>';}).join(""):'<span class="pp open">Noch frei</span>')
   +'</div><button type="button" class="taskbtn" data-act="task" data-task="'+esc(t.id)+'" aria-pressed="'+mineT+'"'+dis+'>'+label+'</button></div>';
 });
 return h+'</div>';
}

var SK_L={yes:"Ja",no:"Nein",maybe:"Noch unklar"};
var AT_L={group:"Mit der Gruppe per Schiff am 02.01.",own2:"Ich fahre am 02.01. anders nach Wien",unsure:"Noch unklar"};
var ROOM_L={single:"Einzelzimmer",double:"Zweibettzimmer",triple:"Dreibettzimmer",any:"Egal"};
var ROOM_S={single:"Einzel",double:"Zweibett",triple:"Dreibett",any:"egal"};
function tripHTML(){
 var ap=allPeople(),ids=Object.keys(ap);
 var dis=(!ready||!canWrite||!uid)?" disabled":"";
 function opts(g,map,cur){return '<div class="optgrid">'+Object.keys(map).map(function(k){return '<button type="button" class="vb opt" data-act="trip" data-group="'+g+'" data-val="'+k+'" aria-pressed="'+(cur===k)+'"'+dis+'>'+map[k]+'</button>';}).join("")+'</div>';}
 function who(fn){return ids.filter(fn);}
 function tr(p){return ap[p].trip||{};}
 function rm(p){return ap[p].room||{};}
 var h='<p class="subnote" style="margin-top:20px">Trag ein, wer wann dabei ist und wie du schlafen möchtest. Das hilft bei den Buchungen.</p><div class="stack" style="margin-top:12px">'
  +'<section class="card"><h4>Bratislava (01.–02.01.)</h4><p class="cnote">Fährst du mit nach Bratislava?</p>'+opts("sk",SK_L,me.trip.sk)+'</section>'
  +'<section class="card"><h4>Wien</h4><p class="cnote">Die Gruppe fährt am 02.01. abends mit dem Schiff und ist gegen 19 Uhr in Wien. Wie kommst du nach Wien?</p>'+opts("at",AT_L,me.trip.at)+'</section>'
  +'<section class="card"><h4>Zimmer im A&amp;O Wien</h4><p class="cnote">Es gibt Einzel-, Zwei- und Dreibettzimmer.</p>'+opts("room",ROOM_L,me.room.type)
  +'<div class="field"><label for="roomWish">Mit wem möchtest du ins Zimmer? (optional)</label><input id="roomWish" type="text" maxlength="80" value="'+esc(me.room.wish)+'" placeholder="Namen, auch von Leuten, die hier noch nicht eingetragen sind" autocomplete="off"'+dis+'></div></section>'
  +'</div>';
 var skYes=who(function(p){return tr(p).sk==="yes";}),skNo=who(function(p){return tr(p).sk==="no";}),skMaybe=who(function(p){return tr(p).sk==="maybe";});
 var atGroup=who(function(p){return tr(p).at==="group";}),atOwn=who(function(p){return tr(p).at==="own2";}),atUn=who(function(p){return tr(p).at==="unsure";});
 function cnt(t){return who(function(p){return rm(p).type===t;}).length;}
 function line(label,list){return '<span><b>'+label+'</b> '+(list.length?esc(namesOf(list)):"niemand")+'</span>';}
 h+='<h3 class="sub">Überblick</h3><div class="stack" style="margin-top:10px">'
  +'<div class="card"><h4>Bratislava</h4><p class="sum">'+line("Ja ("+skYes.length+")",skYes)+line("Nein ("+skNo.length+")",skNo)+line("Unklar ("+skMaybe.length+")",skMaybe)+'</p></div>'
  +'<div class="card"><h4>Anreise nach Wien</h4><p class="sum">'+line("Mit der Gruppe per Schiff ("+atGroup.length+")",atGroup)+line("Reisen anders am 02.01. ("+atOwn.length+")",atOwn)+line("Unklar ("+atUn.length+")",atUn)+'</p></div>'
  +'<div class="card"><h4>Zimmerwünsche A&amp;O Wien</h4><p class="sum"><span><b>Einzel</b> '+cnt("single")+'</span><span><b>Zweibett</b> '+cnt("double")+'</span><span><b>Dreibett</b> '+cnt("triple")+'</span><span><b>Egal</b> '+cnt("any")+'</span></p></div>'
  +'</div><h3 class="sub">Wer will mit wem</h3><div class="stack" style="margin-top:10px">';
 var named=who(function(p){return rm(p).type||rm(p).wish;});
 if(!named.length)h+='<div class="empty"><p>Noch keine Zimmerwünsche eingetragen.</p></div>';
 named.forEach(function(p){
  h+='<div class="rowcard"><div class="l"><strong>'+esc(nameOf(p))+(p===uid?" (du)":"")+'</strong><small>'+(rm(p).wish?'Möchte mit: '+esc(rm(p).wish):'Kein Wunsch angegeben')+'</small></div><span class="num">'+esc(ROOM_S[rm(p).type]||"offen")+'</span></div>';
 });
 return h+'</div>';
}

/* ---------- Anzeige ---------- */
function toast(msg){
 var t=document.getElementById("toast");t.textContent=msg;t.hidden=false;
 clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.hidden=true;},4200);
}
function render(){
 var ae=document.activeElement;
 if(ae&&view.contains(ae)&&(ae.tagName==="INPUT"||ae.tagName==="TEXTAREA")){pendingRender=true;return;}
 pendingRender=false;
 var n=document.getElementById("nameInput");
 if(document.activeElement!==n)n.value=me.nick||profileFirst||"";
 var b=document.getElementById("banner");
 if(!dbOk||!uid){b.hidden=false;b.textContent="Zum Abstimmen und Eintragen musst du angemeldet sein. Lesen kannst du das Programm trotzdem.";}
 else if(!canWrite){b.hidden=false;b.textContent="Du kannst hier nur lesen. Bitte die Person, die den Link geschickt hat, dir Mitmach-Rechte zu geben.";}
 else b.hidden=true;
 ["plan","mine","group","tasks","trip"].forEach(function(k){document.getElementById("tab-"+k).setAttribute("aria-selected",String(k===tab));});
 document.getElementById("chips").hidden=(tab!=="plan");
 view.innerHTML=tab==="plan"?planHTML():tab==="mine"?mineHTML():tab==="group"?groupHTML():tab==="tasks"?tasksHTML():tripHTML();
}
function buildChips(){
 var h=DAY_ORDER.map(function(id){var d=DAYS[id];return '<button type="button" class="chip '+d.city+'" data-day="'+id+'">'+d.dow+' '+d.date+'</button>';}).join("");
 document.getElementById("chips").innerHTML=h;
}

/* ---------- Speichern ---------- */
function payload(){return {nick:me.nick||profileFirst||"",votes:me.votes,ideas:me.ideas,tasks:me.tasks,trip:me.trip,room:me.room};}
function flush(){
 if(writing||!dirty||!myRef)return;
 writing=true;dirty=false;
 myRef.set(payload()).then(function(){writing=false;if(dirty)flush();},function(e){
  writing=false;
  var code=e&&e.code;
  if(code==="invalid_argument"||code==="revoked"||code==="not_granted"){canWrite=false;render();toast("Speichern ist nicht erlaubt. Du kannst nur lesen.");}
  else if(code==="quota_exceeded"){toast("Der Speicher dieser Seite ist voll. Sag der Person Bescheid, die den Link geschickt hat.");}
  else toast("Das Speichern hat nicht geklappt. Versuch es gleich noch einmal.");
 });
}
function save(){dirty=true;flush();}
function canAct(){
 if(!dbOk||!uid){toast("Zum Mitmachen musst du angemeldet sein.");return false;}
 if(!ready){toast("Einen Moment, die Seite lädt noch.");return false;}
 if(!canWrite){toast("Du kannst hier nur lesen.");return false;}
 return true;
}

/* ---------- Aktionen ---------- */
function setVote(id,v){
 if(!canAct())return;
 if(me.votes[id]===v)delete me.votes[id];else me.votes[id]=v;
 render();save();
}
function isSingle(id){return id.indexOf("tk-")===0||TASKS.some(function(t){return t.id===id&&t.single;});}
function toggleTask(id){
 if(!canAct())return;
 var i=me.tasks.indexOf(id);
 if(i<0&&isSingle(id)){
  var ap=allPeople();
  var taken=Object.keys(ap).some(function(p){return p!==uid&&(ap[p].tasks||[]).indexOf(id)>=0;});
  if(taken){toast("Das hat schon jemand übernommen.");return;}
 }
 if(i>=0)me.tasks.splice(i,1);else me.tasks.push(id);
 render();save();
}
function delIdea(iid){
 if(!canAct())return;
 me.ideas=me.ideas.filter(function(i){return i.id!==iid;});
 delete me.votes["i-"+uid+"-"+iid];
 render();save();
}
function setTrip(g,v){
 if(!canAct())return;
 if(g==="room")me.room.type=(me.room.type===v?"":v);
 else if(g==="sk"||g==="at")me.trip[g]=(me.trip[g]===v?"":v);
 else return;
 render();save();
}
function setTab(t){tab=t;render();window.scrollTo(0,0);}

var sheet=document.getElementById("sheet");
function openSheet(day){
 if(!canAct())return;
 var sel=document.getElementById("ideaDay");
 sel.innerHTML=DAY_ORDER.map(function(id){return '<option value="'+id+'">'+dayLabel(id)+' · '+(DAYS[id].city==="sk"?"Bratislava":"Wien")+'</option>';}).join("")+'<option value="free">Noch kein fester Tag</option>';
 sel.value=day||"free";
 document.getElementById("ideaTitle").value="";
 document.getElementById("ideaNote").value="";
 document.querySelector('input[name="ideaLevel"][value="1"]').checked=true;
 document.querySelector('input[name="ideaKind"][value="act"]').checked=true;
 document.getElementById("ideaTicket").checked=false;
 sheet.hidden=false;
 document.getElementById("ideaTitle").focus();
}
function closeSheet(){sheet.hidden=true;}
document.getElementById("ideaCancel").addEventListener("click",closeSheet);
sheet.addEventListener("click",function(e){if(e.target===sheet)closeSheet();});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&!sheet.hidden)closeSheet();});
document.getElementById("ideaForm").addEventListener("submit",function(e){
 e.preventDefault();
 if(!canAct())return;
 var title=document.getElementById("ideaTitle").value.trim();
 if(!title){toast("Gib der Idee einen Titel.");document.getElementById("ideaTitle").focus();return;}
 if(me.ideas.length>=30){toast("Das sind schon 30 Ideen von dir. Lösche erst eine.");return;}
 var id=Date.now().toString(36)+Math.random().toString(36).slice(2,5);
 var lvl=parseInt(document.querySelector('input[name="ideaLevel"]:checked').value,10)||1;
 var day=document.getElementById("ideaDay").value;
 var kind=document.querySelector('input[name="ideaKind"]:checked').value==="food"?"food":"act";
 me.ideas.push({id:id,day:day,kind:kind,ticket:document.getElementById("ideaTicket").checked,title:title.slice(0,60),note:document.getElementById("ideaNote").value.trim().slice(0,140),level:lvl});
 me.votes["i-"+uid+"-"+id]=document.getElementById("ideaTicket").checked?"yes":"must";
 closeSheet();render();save();toast("Idee eingetragen. Die anderen sehen sie sofort.");
});

view.addEventListener("click",function(e){
 var b=e.target.closest("[data-act]");if(!b||b.disabled)return;
 var a=b.getAttribute("data-act");
 if(a==="vote")setVote(b.getAttribute("data-card"),b.getAttribute("data-v"));
 else if(a==="task")toggleTask(b.getAttribute("data-task"));
 else if(a==="delidea")delIdea(b.getAttribute("data-iid"));
 else if(a==="addidea")openSheet(b.getAttribute("data-day"));
 else if(a==="goto")setTab(b.getAttribute("data-tab"));
 else if(a==="trip")setTrip(b.getAttribute("data-group"),b.getAttribute("data-val"));
});
view.addEventListener("change",function(e){
 if(e.target&&e.target.id==="roomWish"){
  if(!canAct()){e.target.value=me.room.wish||"";return;}
  me.room.wish=e.target.value.trim().slice(0,80);
  save();
 }
});
view.addEventListener("focusout",function(){if(pendingRender)setTimeout(render,0);});
view.addEventListener("toggle",function(e){
 var t=e.target;
 if(t&&t.classList&&t.classList.contains("foodbox"))openFood[t.getAttribute("data-day")]=t.open;
},true);
document.querySelector(".tabs").addEventListener("click",function(e){
 var b=e.target.closest("[data-tab]");if(b)setTab(b.getAttribute("data-tab"));
});
document.getElementById("chips").addEventListener("click",function(e){
 var b=e.target.closest("[data-day]");if(!b)return;
 var el=document.getElementById("day-"+b.getAttribute("data-day"));
 if(el)el.scrollIntoView({behavior:window.matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"});
});
document.getElementById("nameInput").addEventListener("change",function(e){
 if(!canAct()){e.target.value=me.nick||profileFirst||"";return;}
 me.nick=e.target.value.trim().slice(0,30);
 render();save();
});

/* ---------- Start ---------- */
buildChips();
render();
(async function(){
 try {
  const credential = await signInAnonymously(firebaseAuth);
  uid = credential.user.uid;
  dbOk = true;
  myRef = { set: function(data) { return set(ref(firebaseDb, "people/" + uid), data); } };
  onValue(ref(firebaseDb, "people"), function(snapshot) {
   people = snapshot.val() || {};
   if (!writing && !dirty) me = norm(people[uid]);
   ready = true;
   render();
  }, function(error) {
   ready = false;
   render();
   console.error("Firebase-Daten konnten nicht geladen werden:", error);
   toast("Die Datenbank-Verbindung ist fehlgeschlagen. Bitte prüfe die Firebase-Regeln und die autorisierte Domain.");
  });
 } catch (error) {
  dbOk = false;
  uid = null;
  render();
  console.error("Firebase-Anmeldung fehlgeschlagen:", error);
  toast("Anmeldung bei Firebase fehlgeschlagen. Bitte prüfe die autorisierte Domain und die anonyme Anmeldung.");
 }
})();
})();
</script>

</body></html>
